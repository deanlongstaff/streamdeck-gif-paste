name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/com.dean.gifpaste.streamDeckPlugin
          generate_release_notes: true
